[project]
name = "ga4-agent"
version = "0.1.0"
description = "Conversational data analysis agent over the GA4 ecommerce demo dataset"
authors = [
    { name = "hiansdt", email = "vnhiansdt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.45.2",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
