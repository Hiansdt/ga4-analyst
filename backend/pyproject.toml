[project]
name = "ga4-agent"
version = "0.1.0"
description = "Conversational data analysis agent over the GA4 ecommerce demo dataset"
authors = [
    { name = "hiansdt", email = "vnhiansdt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.45.2",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ga4-agent = "ga4_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not bigquery and not llm'"
markers = [
    "bigquery: hits real BigQuery (run with: pytest -m bigquery)",
    "llm: calls the real Anthropic API, costs a few cents (run with: pytest -m llm)",
]

[tool.ruff]
line-length = 120
