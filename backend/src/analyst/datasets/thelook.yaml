# TheLook, a fictitious online clothing store published by Google as synthetic data. The public copy
# (bigquery-public-data.thelook_ecommerce) is regenerated daily, so this definition reads a snapshot
# taken on 2026-09-28 into the project's own thelook_snapshot dataset, which keeps totals verifiable.

name: TheLook Fashion Store
tables:
  - project-712b2ec8-82d4-4a79-b9b.thelook_snapshot
period:
  start: 2019-01-01
  end: 2026-09-27

description: |
  - The business is TheLook, an online clothing retailer that sells men's and women's apparel and accessories worldwide. Its orders, customers, products and website events live in BigQuery; write BigQuery Standard SQL.
  - Tables in `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot`: `orders` (one row per order), `order_items` (one row per item sold), `products`, `users` (customers) and `events` (website activity). Timestamps are in UTC.
  - The data runs from 2019-01-01 to 2026-09-27. Treat 2026-09-27 as today. Resolve relative dates such as "last month" or "recently" against it, and say which dates you used. If a question is about a period outside the data, say that the data does not cover it instead of guessing.
  - The data is synthetic, generated by Google for demos. Say so if a user asks about real-world causes.
  - Product cost is available, so gross profit can be computed. There is no marketing spend data.

dimensions:
  - name: country
    description: Customer's country.
  - name: signup_channel
    description: "How the customer first signed up: Search, Organic, Facebook, Email or Display."
  - name: visit_channel
    description: "Where a website visit came from: Email, Adwords, Facebook, YouTube or Organic."
  - name: browser
    description: Browser used for a website visit.
  - name: category
    description: Product category, e.g. Jeans or Outerwear & Coats.
  - name: brand
    description: Product brand.
  - name: department
    description: Men or Women.
  - name: status
    description: "Order status: Processing, Shipped, Complete, Cancelled or Returned."

blocks:
  - name: orders
    description: |
      One row per order, every status, with the customer's attributes.
    date_column: order_date
    dimensions:
      country: country
      signup_channel: signup_channel
      status: status
    sql: |
      SELECT
        o.order_id,
        o.user_id,
        DATE(o.created_at) AS order_date,
        o.status,
        o.num_of_item,
        u.country,
        u.traffic_source AS signup_channel
      FROM `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.orders` AS o
      JOIN `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.users` AS u ON u.id = o.user_id
      WHERE o.created_at < TIMESTAMP('2026-09-28')
  - name: order_lines
    description: |
      One row per item sold, every status, with the product and the customer's attributes.
    date_column: order_date
    dimensions:
      country: country
      signup_channel: signup_channel
      category: category
      brand: brand
      department: department
      status: status
    sql: |
      SELECT
        i.order_id,
        i.user_id,
        DATE(i.created_at) AS order_date,
        i.status,
        i.sale_price,
        p.cost,
        p.name AS product_name,
        p.category,
        p.brand,
        p.department,
        u.country,
        u.traffic_source AS signup_channel
      FROM `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.order_items` AS i
      JOIN `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.products` AS p ON p.id = i.product_id
      JOIN `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.users` AS u ON u.id = i.user_id
      WHERE i.created_at < TIMESTAMP('2026-09-28')
  - name: sessions
    description: |
      One row per website visit, including anonymous visitors. `converted` is true when the visit included a purchase.
    date_column: session_date
    dimensions:
      visit_channel: visit_channel
      browser: browser
    sql: |
      SELECT
        session_id,
        ANY_VALUE(user_id) AS user_id,
        DATE(MIN(created_at)) AS session_date,
        ANY_VALUE(traffic_source) AS visit_channel,
        ANY_VALUE(browser) AS browser,
        LOGICAL_OR(event_type = 'purchase') AS converted
      FROM `project-712b2ec8-82d4-4a79-b9b.thelook_snapshot.events`
      WHERE created_at < TIMESTAMP('2026-09-28')
      GROUP BY session_id

block_notes: |
  The blocks stop at 2026-09-27: the snapshot also holds events dated after it, which the generator created ahead of time.

metrics:
  - name: revenue
    block: order_lines
    sql: ROUND(SUM(IF(status NOT IN ('Cancelled', 'Returned'), sale_price, 0)), 2)
    description: Sales in USD, excluding cancelled and returned items.
  - name: gross_profit
    block: order_lines
    sql: ROUND(SUM(IF(status NOT IN ('Cancelled', 'Returned'), sale_price - cost, 0)), 2)
    description: Revenue minus product cost, in USD.
  - name: units_sold
    block: order_lines
    sql: COUNTIF(status NOT IN ('Cancelled', 'Returned'))
    description: Items sold, excluding cancelled and returned items.
  - name: average_order_value
    block: order_lines
    sql: ROUND(SAFE_DIVIDE(SUM(IF(status NOT IN ('Cancelled', 'Returned'), sale_price, 0)), COUNT(DISTINCT IF(status NOT IN ('Cancelled', 'Returned'), order_id, NULL))), 2)
    description: Revenue divided by orders, in USD.
  - name: item_return_rate_pct
    block: order_lines
    sql: ROUND(100 * SAFE_DIVIDE(COUNTIF(status = 'Returned'), COUNTIF(status != 'Cancelled')), 2)
    description: Share of items that were not cancelled but were returned, already in percent. Use it to compare categories or brands.
  - name: orders
    block: orders
    sql: COUNTIF(status NOT IN ('Cancelled', 'Returned'))
    description: Orders, excluding cancelled and returned ones.
  - name: buyers
    block: orders
    sql: COUNT(DISTINCT IF(status NOT IN ('Cancelled', 'Returned'), user_id, NULL))
    description: Customers with at least one order that was not cancelled or returned.
  - name: cancellation_rate_pct
    block: orders
    sql: ROUND(100 * SAFE_DIVIDE(COUNTIF(status = 'Cancelled'), COUNT(*)), 2)
    description: Share of placed orders that were cancelled, already in percent.
  - name: return_rate_pct
    block: orders
    sql: ROUND(100 * SAFE_DIVIDE(COUNTIF(status = 'Returned'), COUNTIF(status != 'Cancelled')), 2)
    description: Share of orders that were not cancelled but were returned, already in percent.
  - name: sessions
    block: sessions
    sql: COUNT(*)
    description: Website visits, including anonymous visitors.
  - name: converted_sessions
    block: sessions
    sql: COUNTIF(converted)
    description: Visits that included a purchase.
  - name: conversion_rate_pct
    block: sessions
    sql: ROUND(100 * SAFE_DIVIDE(COUNTIF(converted), COUNT(*)), 3)
    description: Converted visits divided by visits, already in percent.

reference_totals: |
  Full-period values from the building blocks, for sanity checks: revenue $8,057,059, gross profit $4,183,547, orders 94,173, items sold 135,619, buyers 66,193, sessions 682,474, converted sessions 180,539 (26.45% conversion rate). A total above these, or a share or rate above 100%, means the query is wrong.

metric_notes: |
  - Revenue, orders, units and buyers exclude cancelled and returned orders. Order status is the same on an order and on each of its items.
  - Revenue is `sale_price` from `order_lines`. Never sum it after joining to `orders` or `sessions`.
  - `events` has one `purchase` event per item sold, not per order: count orders from `orders`.
  - Two different channels exist. `signup_channel` is how a customer first signed up and belongs to orders and customers. `visit_channel` is where a single website visit came from. Never compare one with the other or join them as if they were the same.
  - About half of all website events come from anonymous visitors without a `user_id`, so sessions cannot be linked to customers reliably.
  - Gross profit uses the product's current cost; there is no historical cost.

example_questions:
  - How are we doing this year?
  - Which categories bring in the most gross profit?
  - Which categories get returned the most?
  - Show me monthly revenue for 2026.
